name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 / RtAudio
            cxx: g++
            rtaudio: "ON"
          - name: GCC 13 / no RtAudio
            cxx: g++
            rtaudio: "OFF"
          - name: Clang 20 / RtAudio
            cxx: clang++
            clang: "20"
            rtaudio: "ON"
          - name: Clang 20 / no RtAudio
            cxx: clang++
            clang: "20"
            rtaudio: "OFF"

    steps:
      - uses: actions/checkout@v7

      - name: Install Clang
        if: matrix.clang
        env:
          CLANG_VERSION: ${{ matrix.clang }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++

      - name: Install RtAudio system headers
        if: matrix.rtaudio == 'ON'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DAPSIS_DRIFT_RTAUDIO=${{ matrix.rtaudio }}
          -DAPSIS_DRIFT_MIDI_SPIKE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Headless benchmark smoke test
        run: ./build/apsis-drift --benchmark 3
