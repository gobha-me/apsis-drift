name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.paths.outcome == 'success' && steps.paths.outputs.cpp || 'true' }}
      godot: ${{ steps.paths.outcome == 'success' && steps.paths.outputs.godot || 'true' }}
      lint_scope: ${{ steps.paths.outcome == 'success' && steps.paths.outputs.lint_scope || 'full' }}
      lint_files: ${{ steps.paths.outputs.lint_files }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # Both PR tips and their merge base are needed, even for large PRs.
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          cpp, godot, lint_scope, lint_files = "true", "true", "full", []
          if os.environ["EVENT_NAME"] == "pull_request":
              # No API file limit; -z preserves names and --no-renames includes
              # both sides of a rename, including deleted headers/build inputs.
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              raw = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  f"{base}...{head}", "--",
              ])
              files = [os.fsdecode(path) for path in raw.split(b"\0") if path]
              safe = files and all(
                  not any(c.isspace() or ord(c) < 32 or ord(c) > 126 for c in path)
                  and not any(part in ("", ".", "..") for part in path.split("/"))
                  for path in files
              )
              if safe:
                  # CTest's asset-provenance-manifest checks these files and
                  # local license terms, including docs/ and godot/ references.
                  manifest = json.loads(Path("assets/provenance.json").read_text())
                  cpp_files = {"assets/provenance.json", "godot/binding-profile.json",
                               "godot/freedom.gdextension.in"}
                  for asset in manifest["assets"]:
                      cpp_files.update(asset["files"])
                      terms = asset["license"]["terms"]
                      if not terms.startswith("https://"):
                          cpp_files.add(terms)
                  # NativeData/CoreTests read native packages; TerminalTests
                  # reads music/SFX. In addition, audio_pack_test.cpp recursively
                  # copies the entire assets/ tree, so all assets are C++ inputs.
                  cpp_prefixes = ("assets/",)

                  def is_doc(path):
                      return path.startswith("docs/") or (
                          path.lower().endswith(".md")
                          and ("/" not in path
                               or (path.startswith(".github/") and path.count("/") == 1))
                      )

                  relevant = any(path in cpp_files or path.startswith(cpp_prefixes)
                                 for path in files)
                  if not relevant:
                      if all(is_doc(path) for path in files):
                          cpp, godot = "false", "false"
                      elif all(is_doc(path) or path.startswith(("godot/", "assets/"))
                               for path in files):
                          cpp = "false"
                  full_lint_files = {".clang-tidy", ".clang-format", "CMakeLists.txt",
                                     "tools/lint.sh", "tools/check_nolint.sh",
                                     ".github/workflows/ci.yml"}
                  full_lint = any(
                      path in full_lint_files or path.rsplit("/", 1)[-1] in full_lint_files
                      or path.startswith(("cmake/", "third_party/"))
                      # Unknown locations fail safe to full analysis as well.
                      or not (is_doc(path) or path.startswith((
                          "src/", "include/", "test/", "tools/", ".github/",
                          "godot/", "assets/", "cmake/", "third_party/")))
                      or re.search(r"\.(h|hh|hpp|hxx|h\+\+|hp|inl|inc|ipp|tpp|txx|cuh)(\.in)?$",
                                   path, re.IGNORECASE)
                      for path in files
                  )
                  # Deleted TUs cannot be linted. lint.sh intersects this list
                  # with its existing TU regex, including the Godot exclusions.
                  lint_files = sorted(path for path in files
                                      if path.endswith(".cpp") and Path(path).is_file())
                  # Bound the job output; unusually large lists use full lint.
                  if not full_lint and len("\n".join(lint_files)) < 32768:
                      lint_scope = "changed" if lint_files else "none"
                  else:
                      lint_files = []
              else:
                  print("Empty or unclassifiable diff: running everything.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"cpp={cpp}\ngodot={godot}\nlint_scope={lint_scope}\n")
              output.write("lint_files<<APSIS_TIDY_FILES\n" + "\n".join(lint_files)
                           + "\nAPSIS_TIDY_FILES\n")
          summary = f"Changed paths: C++={cpp}, Godot={godot}, lint={lint_scope}."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PY

  quality:
    name: formatting and static analysis
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Prefer the Ubuntu package archive
        run: sudo bash tools/ci_ubuntu_mirror.sh

      - name: Install Clang tooling and lint dependencies
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo apt-get install -y \
            "clang-format-$CLANG_VERSION" \
            "clang-tidy-$CLANG_VERSION" \
            ffmpeg libasound2-dev python3-numpy

      - name: Check formatting
        run: tools/format.sh --check

      - name: Check clang-tidy suppression policy
        run: |
          tools/check_nolint.sh --self-test
          tools/check_nolint.sh

      - name: Check native test-runner failure handling
        run: python3 test/native_runner_test.py

      - name: Check parallel native CI provenance and failure handling
        run: python3 test/native_ci_test.py

      - name: Check native asset package refusal and atomic preparation
        run: python3 test/native_asset_package_test.py

      - name: Check complete native assembly publication and refusal
        run: python3 test/freedom_native_asset_preparation_test.py

      - name: Check operating asset package refusal and atomic preparation
        run: python3 test/operating_asset_package_test.py

      - name: Check operating motion source identity and atomic preparation
        run: python3 test/operating_motion_package_test.py

      - name: Check boarding support identity and candidate geometry
        run: python3 test/boarding_support_package_test.py

      - name: Check lower cockpit source identity and contact package admission
        run: python3 test/lower_cockpit_contact_package_test.py

      - name: Check operating GLB numeric and buffer boundaries
        run: python3 test/wayfarer_operating_glb_audit_test.py

      - name: Check operating GLB source and node bindings
        run: python3 test/operating_glb_binding_test.py

      - name: Check restraint subset integrity and atomic export boundaries
        run: python3 test/wayfarer_restraint_export_checks_test.py

      - name: Check boarding contact qualification policy
        run: python3 test/boarding_contact_policy_test.py

      - name: Check complete-source material inventory bounds and fingerprints
        run: |
          python3 test/tools/material_inventory_test.py
          python3 test/material_source_completion_test.py
          python3 test/prepare_material_source_test.py
          python3 test/prepare_checkpoint_material_extension_test.py
          python3 tools/boarding/prepare_hatch_seal_material.py --self-test
          python3 test/prepare_hatch_seal_material_test.py
          python3 tools/boarding/prepare_separation_ring_material.py --self-test
          python3 test/prepare_separation_ring_material_test.py

      - name: Check corrected-rest attribution and finite assembly proofs
        run: python3 test/wayfarer_corrected_rest_checks_test.py

      - name: Check corrected-rest atomic publication and failure boundaries
        run: python3 test/wayfarer_corrected_rest_package_test.py

      - name: Check static stowed package geometry and atomic preparation
        run: |
          python3 test/wayfarer_stowed_package_test.py
          python3 tools/prepare_wayfarer_stowed.py --package assets/native/wayfarer-stowed-01 --verify-only

      - name: Check stowed-joint indexed boundaries and bounded observation
        run: python3 test/wayfarer_stowed_joint_observation_test.py

      - name: Check exact fixed-ray bounds and callable identity
        run: |
          python3 test/wayfarer_fixed_winding_differential_test.py
          python3 test/wayfarer_fixed_winding_source_reads_test.py
          python3 test/wayfarer_fixed_winding_callable_semantics_test.py
          python3 test/wayfarer_prepared_winding_test.py
          python3 test/wayfarer_single_order_winding_test.py
          python3 test/wayfarer_contact_bounds_test.py
          python3 test/wayfarer_dispatch_evidence_test.py

      - name: Run static analysis
        env:
          LINT_SCOPE: ${{ needs.changes.outputs.lint_scope }}
          TIDY_FILES: ${{ needs.changes.outputs.lint_files }}
        run: |
          if [[ "$LINT_SCOPE" == "none" ]]; then
            echo "Skipping clang-tidy: no changed C++ TUs or full-lint triggers."
          elif [[ "$LINT_SCOPE" == "changed" && -n "$TIDY_FILES" ]]; then
            APSIS_DRIFT_TIDY_FILES="$TIDY_FILES" tools/lint.sh
          else
            tools/lint.sh
          fi

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPRESS: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 / RtAudio
            cxx: g++
            rtaudio: "ON"
          - name: GCC 13 / no RtAudio
            cxx: g++
            rtaudio: "OFF"
          - name: Clang 20 / RtAudio
            cxx: clang++
            clang: "20"
            rtaudio: "ON"
          - name: Clang 20 / no RtAudio
            cxx: clang++
            clang: "20"
            rtaudio: "OFF"

    steps:
      # Start every matrix entry so protected checks retain their expanded names.
      - name: Explain changed-path decision
        env:
          CPP_NEEDED: ${{ needs.changes.outputs.cpp }}
        run: |
          if [[ "$CPP_NEEDED" == "false" ]]; then
            message="Skipping C++ configure, build and tests: changed paths do not affect C++."
          else
            message="Running C++ checks: relevant changes or detection unavailable."
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.cpp != 'false'

      - name: Restore compiler cache
        if: needs.changes.outputs.cpp != 'false'
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ matrix.cxx }}-rtaudio-${{ matrix.rtaudio }}-terminal-Release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ matrix.cxx }}-rtaudio-${{ matrix.rtaudio }}-terminal-Release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ runner.os }}-${{ github.job }}-${{ matrix.cxx }}-rtaudio-${{ matrix.rtaudio }}-terminal-Release-

      - name: Prefer the Ubuntu package archive
        if: needs.changes.outputs.cpp != 'false'
        run: sudo bash tools/ci_ubuntu_mirror.sh

      - name: Install Clang
        if: needs.changes.outputs.cpp != 'false' && matrix.clang
        env:
          CLANG_VERSION: ${{ matrix.clang }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++

      - name: Install media test tools
        if: needs.changes.outputs.cpp != 'false'
        # Fail closed on a stalled package mirror; retain the normal dependencies.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y ffmpeg ccache

      - name: Install RtAudio system headers
        if: needs.changes.outputs.cpp != 'false' && matrix.rtaudio == 'ON'
        run: sudo apt-get install -y libasound2-dev

      - name: Configure
        if: needs.changes.outputs.cpp != 'false'
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAPSIS_DRIFT_RTAUDIO=${{ matrix.rtaudio }}
          -DAPSIS_DRIFT_MIDI_SPIKE=ON
          -DAPSIS_DRIFT_GODOT_SPIKE=ON

      - name: Build
        if: needs.changes.outputs.cpp != 'false'
        # Bound compiler concurrency: the material TU and Godot headers are large.
        run: cmake --build build --parallel 4

      - name: Test
        if: needs.changes.outputs.cpp != 'false' && (github.event_name != 'pull_request' || matrix.rtaudio == 'ON')
        id: ctest
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: RtAudio-off configuration tests
        if: needs.changes.outputs.cpp != 'false' && github.event_name == 'pull_request' && matrix.rtaudio == 'OFF' && matrix.clang == '20'
        shell: bash
        run: |
          set -euo pipefail
          test_listing=$(ctest --test-dir build -N -L '^rtaudio-config$')
          printf '%s\n' "$test_listing"
          test_count=$(printf '%s\n' "$test_listing" | sed -nE 's/^[[:space:]]*Total Tests: ([0-9]+)[[:space:]]*$/\1/p')
          if [[ ! "$test_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Expected at least one CTest test with label rtaudio-config; Total Tests count is missing, invalid, or zero."
            exit 1
          fi
          ctest --test-dir build --output-on-failure --no-tests=error -L '^rtaudio-config$'

      - name: Headless benchmark smoke test
        if: needs.changes.outputs.cpp != 'false' && (github.event_name != 'pull_request' || matrix.rtaudio == 'ON')
        run: ./build/apsis-drift --benchmark 3

      - name: Collect compiler and math-library provenance
        if: needs.changes.outputs.cpp != 'false' && always()
        env:
          CTEST_STEP_OUTCOME: ${{ steps.ctest.outcome || 'unknown' }}
          CTEST_JOB_LABEL: ${{ matrix.name }}
        run: >-
          python3 tools/ctest_math_provenance.py --build-dir build
          --output ctest-math-provenance.json

      - name: Retain compact CTest provenance
        if: needs.changes.outputs.cpp != 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-math-${{ github.job }}-${{ matrix.cxx }}-${{ matrix.rtaudio || 'OFF' }}-${{ github.run_attempt }}
          path: ctest-math-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Save compiler cache
        if: needs.changes.outputs.cpp != 'false' && always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Compiler cache statistics
        if: needs.changes.outputs.cpp != 'false' && always()
        continue-on-error: true
        run: ccache -s

  native-core:
    name: ${{ matrix.name }} / native core
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPRESS: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            cxx: g++
          - name: Clang 20
            cxx: clang++-20
            clang: "20"
    steps:
      # Start every matrix entry so protected checks retain their expanded names.
      - name: Explain changed-path decision
        env:
          CPP_NEEDED: ${{ needs.changes.outputs.cpp }}
        run: |
          if [[ "$CPP_NEEDED" == "false" ]]; then
            message="Skipping C++ configure, build and tests: changed paths do not affect C++."
          else
            message="Running C++ checks: relevant changes or detection unavailable."
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: needs.changes.outputs.cpp != 'false'

      - name: Restore compiler cache
        if: needs.changes.outputs.cpp != 'false'
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ matrix.cxx }}-rtaudio-OFF-native-core-Release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ matrix.cxx }}-rtaudio-OFF-native-core-Release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ runner.os }}-${{ github.job }}-${{ matrix.cxx }}-rtaudio-OFF-native-core-Release-

      - name: Prefer the Ubuntu package archive
        if: needs.changes.outputs.cpp != 'false'
        run: sudo bash tools/ci_ubuntu_mirror.sh

      - name: Install compiler cache
        if: needs.changes.outputs.cpp != 'false'
        # Fail closed on a stalled package mirror; retain the normal dependencies.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Install Clang
        if: needs.changes.outputs.cpp != 'false' && matrix.clang
        env:
          CLANG_VERSION: ${{ matrix.clang }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"

      - name: Configure without TermForge
        if: needs.changes.outputs.cpp != 'false'
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAPSIS_DRIFT_TERMINAL=OFF
          -DAPSIS_DRIFT_RTAUDIO=OFF
          -DAPSIS_DRIFT_GODOT_SPIKE=ON
          -DAPSIS_DRIFT_GODOT_LIVE=ON

      - name: Build native core, live Godot bridge and headless targets
        if: needs.changes.outputs.cpp != 'false'
        # Use the same bounded compiler concurrency as the terminal/native builds.
        run: cmake --build build-core --parallel 4

      - name: Test native and headless targets
        if: needs.changes.outputs.cpp != 'false'
        id: ctest
        run: ctest --test-dir build-core --output-on-failure

      - name: Collect compiler and math-library provenance
        if: needs.changes.outputs.cpp != 'false' && always()
        env:
          CTEST_STEP_OUTCOME: ${{ steps.ctest.outcome || 'unknown' }}
          CTEST_JOB_LABEL: ${{ format('{0} / native core', matrix.name) }}
        run: >-
          python3 tools/ctest_math_provenance.py --build-dir build-core
          --output ctest-math-provenance.json

      - name: Retain compact CTest provenance
        if: needs.changes.outputs.cpp != 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-math-${{ github.job }}-${{ matrix.cxx }}-OFF-${{ github.run_attempt }}
          path: ctest-math-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Save compiler cache
        if: needs.changes.outputs.cpp != 'false' && always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Compiler cache statistics
        if: needs.changes.outputs.cpp != 'false' && always()
        continue-on-error: true
        run: ccache -s

  native-godot-build:
    name: Godot 4.7.2 / verified native build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.godot != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPRESS: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.job }}-g++-rtaudio-OFF-native-bridge-Release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-g++-rtaudio-OFF-native-bridge-Release-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ runner.os }}-${{ github.job }}-g++-rtaudio-OFF-native-bridge-Release-

      - name: Prefer the Ubuntu package archive
        run: sudo bash tools/ci_ubuntu_mirror.sh

      - name: Download and verify Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            --output godot-linux.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-linux.zip' | sha256sum --check
          mkdir build-godot-ci
          python3 -m zipfile -e godot-linux.zip build-godot-ci
          chmod +x build-godot-ci/Godot_v4.7.2-stable_linux.x86_64

      - name: Install software sky-capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 ccache

      - name: Check the actual sky horizon at two camera heights
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 3840x2160x24"
          python3 tools/test_native_sky.py
          --godot "$PWD/build-godot-ci/Godot_v4.7.2-stable_linux.x86_64"
          --output-parent build-native-sky
          --timeout 45

      - name: Retain the bounded sky-capture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-sky-camera
          path: |
            build-native-sky/sky-camera-*/*.json
            build-native-sky/sky-camera-*/*.log
            build-native-sky/sky-camera-*/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Configure native bridge without TermForge
        run: >-
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DAPSIS_DRIFT_TERMINAL=OFF
          -DAPSIS_DRIFT_RTAUDIO=OFF
          -DAPSIS_DRIFT_GODOT_SPIKE=ON
          -DAPSIS_DRIFT_GODOT_LIVE=ON

      - name: Build bridge and saved-start fixtures
        run: >-
          cmake --build build-native --parallel 4
          --target apsis_freedom_bridge
          apsis-drift-godot-snapshot
          apsis-drift-freedom-start-fixture
          apsis-drift-freedom-planetary-fixture
          apsis-drift-landed-craft-tests
          apsis-drift-freedom-moon-fixture
          apsis-drift-freedom-minor-fixture
          apsis-drift-native-impact-tests
          apsis-drift-freedom-flight-import-tests
          apsis-drift-native-system-release-tests
          apsis-drift-native-orbital-survey-tests
          apsis-drift-native-known-chart-map-tests
          apsis-drift-native-derelict-tests
          apsis-drift-native-derelict-recovery-tests

      - name: Package the verified engine and native executables
        run: >-
          python3 tools/native_ci.py pack
          --build-dir build-native
          --godot "$PWD/build-godot-ci/Godot_v4.7.2-stable_linux.x86_64"
          --archive native-ci.tar.gz
          --manifest native-ci-manifest.json

      - name: Share the immutable native build
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-build
          path: |
            native-ci.tar.gz
            native-ci-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Save compiler cache
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Compiler cache statistics
        if: always()
        continue-on-error: true
        run: ccache -s

  native-godot-group:
    name: Godot 4.7.2 / native group ${{ matrix.group }}
    needs: [changes, native-godot-build]
    if: ${{ !cancelled() && needs.changes.outputs.godot != 'false' && needs.native-godot-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Download the immutable native build
        uses: actions/download-artifact@v8
        with:
          name: native-ci-build
          path: native-ci-build

      # Each hosted worker has its own project, imports, saves and user data.
      # The existing runner and every per-process deadline remain unchanged.
      - name: Verify the build and run this native group
        run: >-
          python3 tools/native_ci.py run
          --archive native-ci-build/native-ci.tar.gz
          --manifest native-ci-build/native-ci-manifest.json
          --group ${{ matrix.group }}
          --output-parent build-native-contracts-g${{ matrix.group }}
          --receipt invocation-g${{ matrix.group }}.json

      - name: Retain this group's native runtime logs and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-native-group-${{ matrix.group }}
          path: |
            invocation-g${{ matrix.group }}.json
            build-native-contracts-g${{ matrix.group }}/*.log
