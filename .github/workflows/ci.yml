name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: formatting and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Clang tooling and lint dependencies
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo apt-get install -y \
            "clang-format-$CLANG_VERSION" \
            "clang-tidy-$CLANG_VERSION" \
            ffmpeg libasound2-dev python3-numpy

      - name: Check formatting
        run: tools/format.sh --check

      - name: Check native test-runner failure handling
        run: python3 test/native_runner_test.py

      - name: Check native asset package refusal and atomic preparation
        run: python3 test/native_asset_package_test.py

      - name: Check complete native assembly publication and refusal
        run: python3 test/freedom_native_asset_preparation_test.py

      - name: Check operating asset package refusal and atomic preparation
        run: python3 test/operating_asset_package_test.py

      - name: Check operating motion source identity and atomic preparation
        run: python3 test/operating_motion_package_test.py

      - name: Check boarding support identity and candidate geometry
        run: python3 test/boarding_support_package_test.py

      - name: Check lower cockpit source identity and contact package admission
        run: python3 test/lower_cockpit_contact_package_test.py

      - name: Check operating GLB numeric and buffer boundaries
        run: python3 test/wayfarer_operating_glb_audit_test.py

      - name: Check operating GLB source and node bindings
        run: python3 test/operating_glb_binding_test.py

      - name: Check restraint subset integrity and atomic export boundaries
        run: python3 test/wayfarer_restraint_export_checks_test.py

      - name: Check boarding contact qualification policy
        run: python3 test/boarding_contact_policy_test.py

      - name: Check complete-source material inventory bounds and fingerprints
        run: |
          python3 test/tools/material_inventory_test.py
          python3 test/material_source_completion_test.py
          python3 test/prepare_material_source_test.py
          python3 test/prepare_checkpoint_material_extension_test.py
          python3 tools/boarding/prepare_hatch_seal_material.py --self-test
          python3 test/prepare_hatch_seal_material_test.py
          python3 tools/boarding/prepare_separation_ring_material.py --self-test
          python3 test/prepare_separation_ring_material_test.py

      - name: Check corrected-rest attribution and finite assembly proofs
        run: python3 test/wayfarer_corrected_rest_checks_test.py

      - name: Check corrected-rest atomic publication and failure boundaries
        run: python3 test/wayfarer_corrected_rest_package_test.py

      - name: Check static stowed package geometry and atomic preparation
        run: |
          python3 test/wayfarer_stowed_package_test.py
          python3 tools/prepare_wayfarer_stowed.py --package assets/native/wayfarer-stowed-01 --verify-only

      - name: Check stowed-joint indexed boundaries and bounded observation
        run: python3 test/wayfarer_stowed_joint_observation_test.py

      - name: Check exact fixed-ray bounds and callable identity
        run: |
          python3 test/wayfarer_fixed_winding_differential_test.py
          python3 test/wayfarer_fixed_winding_source_reads_test.py
          python3 test/wayfarer_fixed_winding_callable_semantics_test.py
          python3 test/wayfarer_prepared_winding_test.py
          python3 test/wayfarer_single_order_winding_test.py
          python3 test/wayfarer_contact_bounds_test.py
          python3 test/wayfarer_dispatch_evidence_test.py

      - name: Run static analysis
        run: tools/lint.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13 / RtAudio
            cxx: g++
            rtaudio: "ON"
          - name: GCC 13 / no RtAudio
            cxx: g++
            rtaudio: "OFF"
          - name: Clang 20 / RtAudio
            cxx: clang++
            clang: "20"
            rtaudio: "ON"
          - name: Clang 20 / no RtAudio
            cxx: clang++
            clang: "20"
            rtaudio: "OFF"

    steps:
      - uses: actions/checkout@v7

      - name: Install Clang
        if: matrix.clang
        env:
          CLANG_VERSION: ${{ matrix.clang }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++

      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install RtAudio system headers
        if: matrix.rtaudio == 'ON'
        run: sudo apt-get install -y libasound2-dev

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DAPSIS_DRIFT_RTAUDIO=${{ matrix.rtaudio }}
          -DAPSIS_DRIFT_MIDI_SPIKE=ON
          -DAPSIS_DRIFT_GODOT_SPIKE=ON

      - name: Build
        # Bound compiler concurrency: the material TU and Godot headers are large.
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Headless benchmark smoke test
        run: ./build/apsis-drift --benchmark 3

  native-core:
    name: ${{ matrix.name }} / native core
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            cxx: g++
          - name: Clang 20
            cxx: clang++-20
            clang: "20"
    steps:
      - uses: actions/checkout@v7

      - name: Install Clang
        if: matrix.clang
        env:
          CLANG_VERSION: ${{ matrix.clang }}
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"

      - name: Configure without TermForge
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release
          -DAPSIS_DRIFT_TERMINAL=OFF
          -DAPSIS_DRIFT_RTAUDIO=OFF
          -DAPSIS_DRIFT_GODOT_SPIKE=ON
          -DAPSIS_DRIFT_GODOT_LIVE=ON

      - name: Build native core, live Godot bridge and headless targets
        # Use the same bounded compiler concurrency as the terminal/native builds.
        run: cmake --build build-core --parallel 4

      - name: Test native and headless targets
        run: ctest --test-dir build-core --output-on-failure

  native-godot-runtime:
    name: Godot 4.7.2 / saved Freedom start
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            --output godot-linux.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-linux.zip' | sha256sum --check
          mkdir build-godot-ci
          python3 -m zipfile -e godot-linux.zip build-godot-ci
          chmod +x build-godot-ci/Godot_v4.7.2-stable_linux.x86_64

      - name: Configure native bridge without TermForge
        run: >-
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
          -DAPSIS_DRIFT_TERMINAL=OFF
          -DAPSIS_DRIFT_RTAUDIO=OFF
          -DAPSIS_DRIFT_GODOT_SPIKE=ON
          -DAPSIS_DRIFT_GODOT_LIVE=ON

      - name: Build bridge and saved-start fixtures
        run: >-
          cmake --build build-native --parallel 4
          --target apsis_freedom_bridge
          apsis-drift-godot-snapshot
          apsis-drift-freedom-start-fixture

      - name: Check saved-start bridge, native shell and audio shutdown in Godot
        run: >-
          python3 tools/test_godot_native.py
          --godot "$PWD/build-godot-ci/Godot_v4.7.2-stable_linux.x86_64"
          --build-dir build-native
          --output-parent build-native-contracts
          --test freedom_start --test native_shell --test native_save
          --test native_asset_import --test native_station_view --test wayfarer_frame
          --test saved_flight
          --test native_port --test native_walk
          --test native_assembly --test native_start_staging
          --test wayfarer_operating
          --test recorded_audio_shutdown

      - name: Retain native runtime logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-saved-start-contracts
          path: |
            build-native-contracts/native-contracts-*/report.json
            build-native-contracts/native-contracts-*/*.log
          if-no-files-found: warn
          retention-days: 7
